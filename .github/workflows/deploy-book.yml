name: Deploy Book Site

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Package install scripts run here; keep the token out of this step.
      - name: Install wrangler
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/wrangler" wrangler@4.151.3

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy book/ \
            --project-name pb-playbook \
            --branch main \
            --commit-dirty=true

name: Documentation Quality & Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks-action needs full history for the push diff range; the release-window tests need tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Lint markdown files
        run: |
          npm install -g markdownlint-cli
          markdownlint --config .markdownlint.json 'docs/**/*.md' 'commands/**/*.md'

      - name: Install Python tooling
        run: python3 -m pip install --quiet pytest pyyaml markdown-it-py==4.0.0

      - name: Validate command conventions
        run: python3 scripts/validate-conventions.py

      # The pipeline feeds /pb-what-next and writes a gitignored artifact, so
      # nothing in the repo records whether it still runs. Not --strict: that
      # promotes 113 confidence-score warnings to errors, and some are false
      # positives from the extractor reading fenced sample blocks as references.
      - name: Extract and validate playbook metadata
        run: |
          python3 scripts/extract-playbook-metadata.py
          python3 scripts/validate-extracted-metadata.py .playbook-metadata.json

      - name: Run Python tests
        run: python3 -m pytest tests/ -q

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # A version bump needs a new sum: the release asset's sha256, as GitHub lists it.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.5.2"
          MDBOOK_SHA256: "084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          tar xzf mdbook.tar.gz -C /usr/local/bin

      - name: Install mdbook-mermaid
        env:
          MERMAID_VERSION: "0.17.0"
          MERMAID_SHA256: "8aced70d781830fb0e81988f081c4abdd49e056a001ae2f1e4d484e1f6385c57"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mermaid.tar.gz "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VERSION}/mdbook-mermaid-v${MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MERMAID_SHA256}  mermaid.tar.gz" | sha256sum -c -
          tar xzf mermaid.tar.gz -C /usr/local/bin

      - name: Build mdbook
        run: ./scripts/build-mdbook.sh

      - name: Check internal links
        run: python3 scripts/check-links.py

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: mdbook-out

  deploy:
    name: Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
